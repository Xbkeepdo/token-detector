    vision_end_token: "<|vision_end|>"
    prompt_template: null

feature_extraction:
  ads:
    top_patch_pct: 0.10
    connectivity: 8
    min_blob_area: 3
    top_k_layers: 10

  cgc:
    top_k_pct: 0.05
    mid_layer_pct: [0.25, 0.75]
    use_attn_weighting: false

  dgst_t:
    # Core settings. Tried tau values: 0.05, 0.07, 0.10.
    tau: 0.07
    transport_top_k: 64
    cost_mode: "decomposed"
    lambda_d: 1.0
    lambda_s: 1.0
    lambda_t: 1.0
    lambda_int: 1.0
    baseline_layers: 10
    risk_start_layer: 15
    alpha: 2.0
    ot_solver: "emd"
    atarget_visual_top_k: 32

    # Raw vs cap085/topmass outputs.
    compute_topmass_085: false
    compute_capped_topmass_085: false
    topmass_085_alpha: 0.85
    capped_topmass_085_alpha: 0.85
    capped_topmass_085_min_k: 32
    capped_topmass_085_max_k: 64

    # Target gate. Choose: legacy_prob, relative_vll dual.
    target_gate_mode: "relative_vll"
    relative_vll_mad_epsilon: 1.0e-6
    relative_vll_logit_source: "h_mid"

    # Cost variants. Keep primary geo, semantic-match geo, and geo state-update
    # lu=1.0 variants by default.
    relative_cost_mode: "geo"
    relative_cost_modes: ["geo", "semantic_match_geo"]
    relative_cost_state_modes: ["state_update"]
    relative_cost_update_lambdas: [1.0]
    relative_barrier_lambda: 1.0
    relative_barrier_margin: 0.5
    relative_barrier_max: 3.0

    # State/update variants are disabled by default. Uncomment for sweeps.
    # relative_cost_state_modes: ["mid", "out", "avg", "state_update"]
    # relative_cost_update_lambdas: [0.05, 0.10, 0.20, 1.0]

    # Source distribution and delta-source variants.
    source_distribution_mode: "softmax"
    # source_modes: ["legacy_ffn", "delta_src"]
    # target_attention_gammas: [0.0, 0.5, 1.0]
    target_attention_epsilon: 1.0e-12

    # Prompt-support variants.
    dgst_t_prompt_support_mode: "full"
    dgst_t_user_prompt_text: "Describe this image."

    # FFN diagnostic variants.
    compute_ffn_injection_features: false
    ffn_injection_evidence_top_k: 32
    ffn_injection_evidence_rank: 8
    ffn_injection_eps: 1.0e-8

    # Dual-scope extraction. See switch map above.
    dgst_t_dual_scope: true

dataset:
  coco_root: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco"
  annotation_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/instances_val2014.json"
  captions_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/captions_val2014.json"
  num_images: 4000
  train_ratio: 0.90
  seed: 42

classifiers:
  xgb:
    max_depth: [4, 6, 8]
    learning_rate: [0.1, 0.05]
    n_estimators: [100, 200, 500]
  rf:
    max_depth: [null, 10, 20]
    n_estimators: [200, 400, 600]
  mlp:
    hidden_layer_sizes: [[64], [128], [256]]
    learning_rate_init: [0.01, 0.001]
    solver: ["adam", "sgd"]
    max_iter: 500

pope:
  pope_dir: "data/pope"
  splits: ["random", "popular", "adversarial"]
  prompt_templates:
    llava_1_5_7b: "USER: <image>\n{question}\nAnswer the question using a single word or phrase.\nASSISTANT:"
    llava_onevision_1_5_8b: "{question}\nAnswer the question using a single word or phrase."
    llava_onevision_1_5_8b_instruct: "{question}\nAnswer the question using a single word or phrase."
    internvl_2_5_8b: "{question}\nAnswer the question using a single word or phrase."
    qwen2_5_vl_7b: "{question}\nAnswer the question using a single word or phrase."
    _default: "{question}\nAnswer the question using a single word or phrase."
