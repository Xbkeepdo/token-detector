feature_extraction:
  # Extraction-only model settings. Existing captions keep their original
  # generation provenance; feature manifests record these effective values.
  model_overrides:
    llava_next_8b:
      image_grid_pinpoints: [[336, 336]]
      dgst_attention_query_chunk_size: null
      dgst_capture_device: null

  # Family switches define what is available; run.extraction_mode selects the
  # active subset without adding method switches to run.sh.
  method:
    enabled: true
  ads_cgc:
    enabled: true
  baseline:
    enabled: true
    output_subdir: "baseline"
    methods: ["metatoken", "svar", "projectaway","dhcp"]           # Optional: "dhcp", "halloc"
    seed: 42
    metatoken:
      classifiers: ["lr", "gb"]             # LR(lbfgs), GB(100 estimators).
      gb_n_estimators: 100
    svar:
      protocols: ["controlled"]             # Exact response offsets; shared fair samples.
      # Extraction stores all layers; training slices absolute layers [5,19).
      layer_start: 5                         # Training start, inclusive.
      layer_end: 19                          # Training end, exclusive (layers 5..18).
      hidden_dim: 248
      learning_rate: 0.001
      batch_size: 32
      epochs: 50
    dhcp:
      # Cross-backbone adaptation: dynamic visual grids are mass-preservingly
      # resized to a fixed shape. The original LLaVA DHCP uses native P=576.
      spatial_size: [12, 12]
      hidden_dim: 128
      learning_rate: 0.001
      batch_size: 1024
      epochs: 30
      shard_dtype: "float16"
    projectaway:
      detection_only: true
    halloc:
      clip_model: "/home/apulis-dev/userdata/models/clip-vit-base-patch32"          # Local pretrained CLIP ViT-B/32.
      visualbert_model: "/home/apulis-dev/userdata/models/visualbert-vqa-coco-pre" # Local pretrained VisualBERT.
      freeze_clip: true
      learning_rate: 1.0e-6
      weight_decay: 1.0e-2
      betas: [0.9, 0.999]
      batch_size: 16
      epochs: 25
      scheduler: "cosine"

  ads:
    top_patch_pct: 0.10
    connectivity: 8
    min_blob_area: 3
    top_k_layers: 10

  cgc:
    top_k_pct: 0.05
    mid_layer_pct: [0.25, 0.75]
    use_attn_weighting: false

  dgst_t:
    enabled: true
    feature_output_profile: "four_gate_vv"   # Matched target gates plus optional direct controls.
    target_gate_mode: "four_gate"
    save_raw_capture: false                   # Only final matrices/curves are serialized.
    # raw_logit is the target-word unembedding dot product; softmax_prob applies
    # vocabulary softmax first.  Methods can also be removed from this list.
    four_gate_methods:
      - "hpre_raw_logit_gauss"
      - "hpre_softmax_prob_gauss"
     # - "hmid_raw_logit_gauss"
     # - "hmid_softmax_prob_gauss"
      # Direct control: visual_hpre -> vocabulary softmax -> target-token
      # probability, normalized over visual tokens. No MAD and no attention gate.
    #  - "hpre_softmax_prob_direct"
      # Control: use post-softmax visual support-attention directly as the
      # target distribution; do not multiply it by a Gaussian gate.
     # - "raw_attention"
    # Independent hpre/raw-logit target switch. Use either one value or both;
    # this list is authoritative for these two methods.
    target_modes: ["raw_logit_gauss"]
    # Boolean form retained for the other convenient one-line switches.
    branches:
      hpre_raw_logit_gauss: true
      hpre_raw_logit_relative_vll: false
      hpre_softmax_prob_gauss: true
      hmid_raw_logit_gauss: false
      hmid_softmax_prob_gauss: false
      hpre_softmax_prob_direct: false
      raw_attention: false

    # Shared transport math for all four gates and both direct controls.
    tau: 0.07
    # InsLen CAFE: max over prompt positions of the generated object-token
    # probability from hpre Logit Lens. The paper/code use scale=0.1, which is
    # equivalent to softmax(logits / temperature) with temperature=10.
    compute_prompt_cafe: true
    prompt_cafe_temperature: 10.0
    prompt_cafe_layer: 22
    source_distribution_mode: "softmax"
    support_scope: "visual"
    # Explicit support-mode switch. Choose ["vv"], ["vp"], or both; when both
    # are enabled they share one model forward and are serialized separately.
    support_modes: ["vv", "vp"]
    # The active alpha sweep does not extract unrelated FFN/MHSA dominance.
    compute_ffn_injection_features: false
    ffn_injection_eps: 1.0e-12
    transport_top_k: 64
    # Primary: C_ij = sqrt((1-cos(h_state_i,h_state_j))/2), where h_state is
    # h_prev for hpre methods. The state-update family uses
    # C_alpha=(1-alpha)*d_state+alpha*d_update for alpha=0.1,...,0.9.
    cost_mode: "sqrt_matched_state"
    cost_modes:
      - "sqrt_matched_state"
      - "sqrt_stateupd_alpha01"
      - "sqrt_stateupd_alpha02"
      - "sqrt_stateupd_alpha03"
      - "sqrt_stateupd_alpha04"
      - "sqrt_stateupd_alpha05"
      - "sqrt_stateupd_alpha06"
      - "sqrt_stateupd_alpha07"
      - "sqrt_stateupd_alpha08"
      - "sqrt_stateupd_alpha09"
    ot_solver: "emd"
    # Each branch selects its own target-dist top-K. EV = target-dist top-K
    # mass * the matched-state mean target cosine in the same region (no shift).
    atarget_visual_top_k: 32
    relative_vll_mad_epsilon: 1.0e-6
    target_attention_epsilon: 1.0e-12
    matrix_dtype: "float32"                  # All saved [L,P] DGST matrices.
    curve_dtype: "float32"                   # All saved [L] DGST curves.

    # Legacy-probability, barrier-cost, topmass, the other FFN diagnostics,
    # and Sinkhorn switches intentionally do not appear in the active config.

dataset:
  coco_root: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco"
  annotation_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/instances_val2014.json"
  captions_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/captions_val2014.json"
  num_images: 4000
  split_strategy: "strict_82"                # Outer train/test=80/20, image-disjoint.
  train_ratio: 0.80
  val_ratio: 0.00                             # No validation split in the strict 8:2 protocol.
  test_ratio: 0.20
  train_images: 3200
  test_images: 800
  validation: null
  seed: 42
  # Cross-model master split.  A different 4,000-image cohort is rejected.
  shared_split_path: "outputs/shared/COCO4000_seed42_image_splits_82.json"

# Root features.pkl probe settings. Names are aliases registered by the
# feature-training implementation and are read directly by train_and_eval.py.
training:
  trainer: "torch_mlp"                     # torch_mlp | sklearn
  positive_class: "real"                   # real headline; hallucination metrics are also reported.
  split_protocol: "strict_82_no_validation" # Image-disjoint 80/20; validation is empty.
  threshold_selection: "train_f1"          # Backward-compatible headline; both thresholds are reported.
  baseline:
    # Training-only selection: this does not change/re-extract baseline/features.pkl.
    # HalLoc may remain in feature_extraction.baseline.methods while being skipped here.
    # Run both heads on the same split/seeds and emit a side-by-side report.
    trainers: ["native_paper", "shared_torch_mlp"]
    methods: ["metatoken", "svar", "projectaway"]
    positive_class: "real"                  # real | hallucination; train F1 selects its threshold.
    seeds: [43, 44, 45]                     # Use [43] for a quick single-seed run.
    write_summary: true                     # Per-seed MD + aggregate mean/std MD.
  torch_probe:
    hidden_sizes: [128, 64, 32]
    structure: "Linear-BatchNorm-ReLU-Dropout"
    activation: "relu"
    batch_norm: true
    dropout: 0.3
    drop_last: true                         # Drop the final incomplete training batch; evaluation never drops rows.
    initialization: "kaiming_uniform_relu"
    output_dim: 1
    optimizer: "adam"
    learning_rate: 0.001
    weight_decay: 0.00001
    batch_size: 256
    max_epochs: 100
    loss: "bce_with_logits"
    feature_normalization: "none"
    scheduler_monitor: "train_loss"
    lr_factor: 0.5
    lr_patience: 5
    early_stopping_monitor: "train_loss"
    early_stopping_patience: 10
    checkpoint_selection: "minimum_train_loss"
    fixed_threshold: 0.5
    threshold_reporting: ["fixed_0.5", "train_f1"]
    seeds: [43, 44, 45]                     # Shared by method, ADS+CGC, and QA dense baselines.
  feature_sets:
    method:
      # VV: fixed sqrt-matched baseline plus alpha=0.1,...,0.9 state/update risks.
      - "hpre_raw_logit_gauss_risk_sqrt_matched_state"
      - "hpre_raw_logit_gauss_risk_sqrt_matched_state+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha01"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha01+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha02"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha02+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha03"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha03+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha04"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha04+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha05"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha05+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha06"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha06+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha07"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha07+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha08"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha08+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha09"
      - "hpre_raw_logit_gauss_risk_sqrt_stateupd_alpha09+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
