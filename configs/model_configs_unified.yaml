# Unified COCO caption and POPE/CLEVR/AMBER QA hallucination-detection settings.
#
# `run.sh` only selects model/output/devices and invokes the three stages.
# Prompt, extraction families, DGST branches and training behavior live here.
# The active DGST profile is visual-only and contains four Gaussian-MAD
# branches plus direct probability and raw-attention controls. Historical VP/legacy/topmass/FFN/
# Sinkhorn experiments remain in their older config files and are intentionally
# absent from this active YAML.

run:
  prompt: "Describe this image."
  extraction_mode: "method_only"                   # all | method_only | ads_cgc_only | baseline_only

experiment:
  mode: "vv"                               # Fixed visual-only support for this profile.

labeling:
  schema_version: 2
  sample_unit: "first_canonical_mention"   # One training sample per image/canonical COCO object.
  primary_locator: "exact_response_offsets" # Exact span over the generated response token IDs.
  save_all_mentions: true                  # Preserve occurrence-level CHAIRs/CHAIRi statistics.
  save_svar_official_samples: true         # Also build the paper-code canonical/surface lookup samples.
  alignment_failure_policy: "error"        # error | skip; never substitute a neighbouring token.

# QA-only dataset/protocol settings. Models, DGST, ADS/CGC, baseline heads and
# probe hyperparameters are shared with the COCO sections below.
qa_benchmarks:
  # QA uses the same four extraction modes as COCO. "all" shares one answer-
  # token forward across DGST, ADS+CGC and every enabled baseline.
  extraction_mode: "all"                  # all | method_only | ads_cgc_only | baseline_only
  baseline_label_protocols:
    - "object_hallucination_yes_only"
    - "answer_correctness_all"
  pope_dir: "/home/apulis-dev/userdata/datasets/POPE"
  coco_image_dir: "/home/apulis-dev/userdata/datasets/POPE/val2014"
  clevr_root: "/home/apulis-dev/userdata/datasets/CLEVR_v1.0"
  amber_root: "/home/apulis-dev/userdata/AMBER"
  prepared_root: "/home/apulis-dev/userdata/datasets/qa_benchmarks"
  output_root: "/home/apulis-dev/userdata/CODEX/test-cocochair/token-detector/outputs/qa_benchmarks"
  split: "strict_image_level_82"
  split_seed: 42
  generation:
    max_new_tokens: 8                     # Overrides caption generation's 512 only for QA.
    temperature: 0.1
    top_p: 0.5
  # AMBER contains native images up to 54 MP. Qwen-family dynamic vision must
  # bound those images or eager attention can request over 100 GiB. This
  # override is applied to both generation and feature extraction, and does
  # not change COCO, POPE, or CLEVR preprocessing.
  dataset_model_overrides:
    amber_discriminative:
      max_pixels: 200704
  # Use the prompt's final causal row (it predicts response_token_ids[0]).
  # Add "question_object_pre_token" later for the optional object-position ablation.
  position_protocols:
    - "prompt_last_token"
  label_protocols:
    - "object_hallucination_yes_only"
    - "answer_correctness_all"
  clevr_object_coverage_policy: "report_locatable_subset"

models:
  llava_1_5_7b:
    hf_name: "/home/apulis-dev/userdata/models/llava/llava-hf/llava-1___5-7b-hf"
    architecture: "concatenation"
    num_visual_tokens: 576
    image_size: 336
    patch_size: 14
    num_layers: 32
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    prompt_template: "USER: <image>\nDescribe this image.\nASSISTANT:"

  llava_onevision_1_5_8b:
    hf_name: "/home/apulis-dev/userdata/models/LLaVA-OneVision-1.5-8B-Instruct"
    architecture: "concatenation"
    num_visual_tokens: null
    image_size: 336
    patch_size: 14
    num_layers: 36
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    vision_start_token: "<|vision_start|>"
    vision_end_token: "<|vision_end|>"
    image_token: "<|image_pad|>"
    prompt_template: null

  llava_onevision_1_5_8b_instruct:
    hf_name: "/home/apulis-dev/userdata/models/LLaVA-OneVision-1.5-8B-Instruct"
    architecture: "concatenation"
    num_visual_tokens: null
    image_size: 336
    patch_size: 14
    num_layers: 36
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    vision_start_token: "<|vision_start|>"
    vision_end_token: "<|vision_end|>"
    image_token: "<|image_pad|>"
    prompt_template: null

  internvl_2_5_8b:
    hf_name: "/home/apulis-dev/userdata/models/InternVL2_5-8B"
    architecture: "concatenation"
    num_visual_tokens: 256
    image_size: 448
    patch_size: 14
    num_layers: 32
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    img_context_token: "<IMG_CONTEXT>"
    prompt_template: "<|im_start|>user\n<image>\nDescribe this image.<|im_end|>\n<|im_start|>assistant\n"

  qwen2_5_vl_7b:
    hf_name: "/home/apulis-dev/userdata/models/Qwen2.5-VL-7B-Instruct"
    architecture: "concatenation"
    num_visual_tokens: null
    image_size: 448
    patch_size: 14
    num_layers: 28
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    vision_start_token: "<|vision_start|>"
    vision_end_token: "<|vision_end|>"
    prompt_template: null

  qwen3_vl_8b:
    hf_name: "/home/apulis-dev/userdata/models/Qwen3-VL-8B-Instruct"
    architecture: "concatenation"
    num_visual_tokens: null
    image_size: 448
    patch_size: 16
    num_layers: 36
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.5
    vision_start_token: "<|vision_start|>"
    vision_end_token: "<|vision_end|>"
    prompt_template: null

feature_extraction:
  # Family switches define what is available; run.extraction_mode selects the
  # active subset without adding method switches to run.sh.
  method:
    enabled: true
  ads_cgc:
    enabled: true
  baseline:
    enabled: true
    output_subdir: "baseline"
    methods: ["metatoken", "svar", "projectaway"]           # Optional: "dhcp", "halloc"
    seed: 42
    metatoken:
      classifiers: ["lr", "gb"]             # LR(lbfgs), GB(100 estimators).
      gb_n_estimators: 100
    svar:
      protocols: ["controlled"]             # Exact response offsets; shared fair samples.
      layer_start: 5                         # Inclusive; official LLaVA range is 5..18.
      layer_end: 19                          # Exclusive.
      hidden_dim: 248
      learning_rate: 0.001
      batch_size: 32
      epochs: 50
    dhcp:
      # Cross-backbone adaptation: dynamic visual grids are mass-preservingly
      # resized to a fixed shape. The original LLaVA DHCP uses native P=576.
      spatial_size: [12, 12]
      hidden_dim: 128
      learning_rate: 0.001
      batch_size: 1024
      epochs: 30
      shard_dtype: "float16"
    projectaway:
      detection_only: true
    halloc:
      clip_model: "/home/apulis-dev/userdata/models/clip-vit-base-patch32"          # Local pretrained CLIP ViT-B/32.
      visualbert_model: "/home/apulis-dev/userdata/models/visualbert-vqa-coco-pre" # Local pretrained VisualBERT.
      freeze_clip: true
      learning_rate: 1.0e-6
      weight_decay: 1.0e-2
      betas: [0.9, 0.999]
      batch_size: 16
      epochs: 25
      scheduler: "cosine"

  ads:
    top_patch_pct: 0.10
    connectivity: 8
    min_blob_area: 3
    top_k_layers: 10

  cgc:
    top_k_pct: 0.05
    mid_layer_pct: [0.25, 0.75]
    use_attn_weighting: false

  dgst_t:
    enabled: true
    feature_output_profile: "four_gate_vv"   # Four Gaussian gates plus two direct controls.
    target_gate_mode: "four_gate"
    save_raw_capture: false                   # Only final matrices/curves are serialized.
    # raw_logit is the target-word unembedding dot product; softmax_prob applies
    # vocabulary softmax first.  Methods can also be removed from this list.
    four_gate_methods:
      - "hpre_raw_logit_gauss"
      - "hpre_softmax_prob_gauss"
      - "hmid_raw_logit_gauss"
      - "hmid_softmax_prob_gauss"
      # Direct control: visual_hpre -> vocabulary softmax -> target-token
      # probability, normalized over visual tokens. No MAD and no attention gate.
      - "hpre_softmax_prob_direct"
      # Control: use post-softmax visual support-attention directly as the
      # target distribution; do not multiply it by a Gaussian gate.
      - "raw_attention"
    # Boolean form retained for convenient one-line switches.
    branches:
      hpre_raw_logit_gauss: true
      hpre_softmax_prob_gauss: true
      hmid_raw_logit_gauss: true
      hmid_softmax_prob_gauss: true
      hpre_softmax_prob_direct: true
      raw_attention: true

    # Shared transport math for all four gates and both direct controls.
    tau: 0.07
    source_distribution_mode: "softmax"
    support_scope: "visual"
    transport_top_k: 64
    cost_mode: "sqrt_matched_state"          # hpre branches use hpre; hmid branches use hmid.
    ot_solver: "emd"
    # Each branch selects its own target-dist top-K. EV = target-dist top-K
    # mass * the matched-state mean target cosine in the same region (no shift).
    atarget_visual_top_k: 32
    relative_vll_mad_epsilon: 1.0e-6
    target_attention_epsilon: 1.0e-12
    matrix_dtype: "float32"                  # All saved [L,P] DGST matrices.
    curve_dtype: "float32"                   # All saved [L] DGST curves.

    # Deprecated VP, legacy-probability, cost-sweep, topmass, FFN-diagnostic,
    # and Sinkhorn switches intentionally do not appear in the active config.

dataset:
  coco_root: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco"
  annotation_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/instances_val2014.json"
  captions_file: "/home/apulis-dev/userdata/DGST/token-grounding-detector/data/coco/annotations/captions_val2014.json"
  num_images: 4000
  split_strategy: "strict_82"                # Outer train/test=80/20, image-disjoint.
  train_ratio: 0.80
  val_ratio: 0.00                             # No validation split in the strict 8:2 protocol.
  test_ratio: 0.20
  seed: 42
  # Cross-model master split.  A different 4,000-image cohort is rejected.
  shared_split_path: "outputs/shared/COCO4000_seed42_image_splits_82.json"

# Root features.pkl probe settings. Names are aliases registered by the
# feature-training implementation and are read directly by train_and_eval.py.
training:
  trainer: "torch_mlp"                     # torch_mlp | sklearn
  positive_class: "real"                   # real headline; hallucination metrics are also reported.
  split_protocol: "strict_82_no_validation" # Fixed epochs, last checkpoint, train-F1 threshold.
  threshold_selection: "train_f1"          # Select the Real-positive F1 threshold on train only.
  baseline:
    # Training-only selection: this does not change/re-extract baseline/features.pkl.
    # HalLoc may remain in feature_extraction.baseline.methods while being skipped here.
    methods: ["metatoken", "svar", "projectaway"]
    positive_class: "real"                  # real | hallucination; train F1 selects its threshold.
    seeds: [42, 43, 44]                     # Use [42] for a quick single-seed run.
    write_summary: true                     # Per-seed MD + aggregate mean/std MD.
  torch_probe:
    hidden_sizes: [256, 128, 64]
    dropout: 0.1
    learning_rate: 0.0003
    batch_size: 128
    weight_decay: 0.0
    num_epochs: 120
    lr_factor: 0.5
    lr_patience: 4
    seeds: [42, 43, 44]                     # Shared by method and ADS+CGC probes.
  feature_sets:
    method:
      - "hpre_raw_logit_gauss_risk"
      - "hpre_raw_logit_gauss_risk+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_softmax_prob_gauss_risk"
      - "hpre_softmax_prob_gauss_risk+hpre_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      - "hmid_raw_logit_gauss_risk"
      - "hmid_raw_logit_gauss_risk+hmid_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hmid_softmax_prob_gauss_risk"
      - "hmid_softmax_prob_gauss_risk+hmid_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      - "raw_attention_risk"
      - "raw_attention_risk+raw_attention_ev_target_dist_mass_x_cosine"
      - "hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      - "hmid_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      - "hmid_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      - "hpre_softmax_prob_direct_ev_target_dist_mass_x_cosine"
      - "raw_attention_ev_target_dist_mass_x_cosine"
      # - "hpre_raw_logit_gauss_risk"
      # - "hpre_raw_logit_gauss_target_cosine"
      # - "hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      # - "hpre_raw_logit_gauss_risk+hpre_raw_logit_gauss_target_cosine"
      # - "hpre_raw_logit_gauss_risk+hpre_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      # - "hpre_softmax_prob_gauss_risk"
      # - "hpre_softmax_prob_gauss_target_cosine"
      # - "hpre_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      # - "hpre_softmax_prob_gauss_risk+hpre_softmax_prob_gauss_target_cosine"
      # - "hpre_softmax_prob_gauss_risk+hpre_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      # - "hmid_raw_logit_gauss_risk"
      # - "hmid_raw_logit_gauss_target_cosine"
      # - "hmid_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      # - "hmid_raw_logit_gauss_risk+hmid_raw_logit_gauss_target_cosine"
      # - "hmid_raw_logit_gauss_risk+hmid_raw_logit_gauss_ev_target_dist_mass_x_cosine"
      # - "hmid_softmax_prob_gauss_risk"
      # - "hmid_softmax_prob_gauss_target_cosine"
      # - "hmid_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      # - "hmid_softmax_prob_gauss_risk+hmid_softmax_prob_gauss_target_cosine"
      # - "hmid_softmax_prob_gauss_risk+hmid_softmax_prob_gauss_ev_target_dist_mass_x_cosine"
      # - "hpre_softmax_prob_direct_risk"
      # - "hpre_softmax_prob_direct_target_cosine"
      # - "hpre_softmax_prob_direct_ev_target_dist_mass_x_cosine"
      # - "hpre_softmax_prob_direct_risk+hpre_softmax_prob_direct_target_cosine"
      # - "hpre_softmax_prob_direct_risk+hpre_softmax_prob_direct_ev_target_dist_mass_x_cosine"
      # - "raw_attention_risk"
      # - "raw_attention_target_cosine"
      # - "raw_attention_ev_target_dist_mass_x_cosine"
      # - "raw_attention_risk+raw_attention_target_cosine"
      # - "raw_attention_risk+raw_attention_ev_target_dist_mass_x_cosine"
      # - "raw_attention_risk+raw_attention_target_cosine+raw_attention_ev_target_dist_mass_x_cosine"
    ads_cgc:
      - "ads"
      - "cgc"
      - "ads+cgc"

classifiers:
  xgb:
    max_depth: [4, 6, 8]
    learning_rate: [0.1, 0.05]
    n_estimators: [100, 200, 500]
  rf:
    max_depth: [null, 10, 20]
    n_estimators: [200, 400, 600]
  mlp:
    hidden_layer_sizes: [[64], [128], [256]]
    learning_rate_init: [0.01, 0.001]
    solver: ["adam", "sgd"]
    max_iter: 500

pope:
  pope_dir: "data/pope"
  splits: ["random", "popular", "adversarial"]
  prompt_templates:
    llava_1_5_7b: "USER: <image>\n{question}\nAnswer the question using a single word or phrase.\nASSISTANT:"
    llava_onevision_1_5_8b: "{question}\nAnswer the question using a single word or phrase."
    llava_onevision_1_5_8b_instruct: "{question}\nAnswer the question using a single word or phrase."
    internvl_2_5_8b: "{question}\nAnswer the question using a single word or phrase."
    qwen2_5_vl_7b: "{question}\nAnswer the question using a single word or phrase."
    _default: "{question}\nAnswer the question using a single word or phrase."
